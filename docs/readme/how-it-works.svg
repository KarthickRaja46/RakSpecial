<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="270" viewBox="0 0 1280 270" role="img" aria-label="How it works: type, preview, print">
<title>How RAK Special works: 1. type the payee and amount, 2. preview it on the cheque, 3. print on any printer</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a0f"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <radialGradient id="halo"><stop offset=".55" stop-color="#d4af6a" stop-opacity=".5"/><stop offset="1" stop-color="#d4af6a" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 H0 V32" fill="none" stroke="#d4af6a" stroke-opacity=".06"/></pattern>
  <filter id="b"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<style>
  .halo{opacity:0;animation:halo 4.5s ease-in-out infinite}
  @keyframes halo{0%{opacity:0;transform:scale(.8)}10%{opacity:1;transform:scale(1)}30%,100%{opacity:0;transform:scale(1.15)}}
  .ring{animation:spin 12s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
  .flow{stroke-dasharray:6 10;animation:flow 1.2s linear infinite} @keyframes flow{to{stroke-dashoffset:-16}}
</style>
<rect x="1" y="1" width="1278" height="268" rx="22" fill="url(#bg)" stroke="#d4af6a" stroke-opacity=".25"/>
<rect x="1" y="1" width="1278" height="268" rx="22" fill="url(#grid)"/>
<path id="track" d="M259 100 H594 M686 100 H1021" stroke="#d4af6a" stroke-opacity=".55" stroke-width="2" class="flow" fill="none"/>
<g>
  <circle r="9" fill="#d4af6a" filter="url(#b)"><animateMotion dur="4.5s" repeatCount="indefinite" path="M213 100 H1067" keyTimes="0;1" calcMode="linear"/></circle>
  <circle r="4" fill="#fff"><animateMotion dur="4.5s" repeatCount="indefinite" path="M213 100 H1067"/></circle>
</g>

  <g transform="translate(213 100)">
    <circle class="halo" r="62" fill="url(#halo)" style="animation-delay:0.0s"/>
    <circle r="46" fill="#0e131d" stroke="#d4af6a" stroke-width="2"/>
    <circle class="ring" r="54" fill="none" stroke="#d4af6a" stroke-opacity=".5" stroke-dasharray="4 8" style="animation-delay:0s"/>
    <g stroke="#d4af6a"><path d="M-14 14 L-10 2 L8 -16 L16 -8 L-2 10 Z M-10 2 L-2 10 M4 -12 L12 -4" fill="none" stroke-width="2.4" stroke-linejoin="round"/></g>
  </g>
  <text x="213" y="190" text-anchor="middle" font-family="'Cascadia Code','Consolas','SFMono-Regular',Menlo,monospace" font-size="15" fill="#d4af6a" letter-spacing="3">01 ▸ TYPE</text>
  <text x="213" y="218" text-anchor="middle" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#e8ebf1">Payee and amount. The words in AED</text>
  <text x="213" y="240" text-anchor="middle" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#e8ebf1">and fils appear instantly.</text>
  <g transform="translate(640 100)">
    <circle class="halo" r="62" fill="url(#halo)" style="animation-delay:1.5s"/>
    <circle r="46" fill="#0e131d" stroke="#d4af6a" stroke-width="2"/>
    <circle class="ring" r="54" fill="none" stroke="#d4af6a" stroke-opacity=".5" stroke-dasharray="4 8" style="animation-delay:-2s"/>
    <g stroke="#d4af6a"><path d="M-20 0 Q0 -17 20 0 Q0 17 -20 0 Z" fill="none" stroke-width="2.4"/><circle r="6" fill="none" stroke-width="2.4"/></g>
  </g>
  <text x="640" y="190" text-anchor="middle" font-family="'Cascadia Code','Consolas','SFMono-Regular',Menlo,monospace" font-size="15" fill="#d4af6a" letter-spacing="3">02 ▸ PREVIEW</text>
  <text x="640" y="218" text-anchor="middle" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#e8ebf1">See it on the cheque, live,</text>
  <text x="640" y="240" text-anchor="middle" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#e8ebf1">before anything is printed.</text>
  <g transform="translate(1067 100)">
    <circle class="halo" r="62" fill="url(#halo)" style="animation-delay:3.0s"/>
    <circle r="46" fill="#0e131d" stroke="#d4af6a" stroke-width="2"/>
    <circle class="ring" r="54" fill="none" stroke="#d4af6a" stroke-opacity=".5" stroke-dasharray="4 8" style="animation-delay:-4s"/>
    <g stroke="#d4af6a"><path d="M-10 -8 V-18 H10 V-8 M-10 8 H-20 V-8 H20 V8 H10 M-10 2 H10 V18 H-10 Z" fill="none" stroke-width="2.4" stroke-linejoin="round"/></g>
  </g>
  <text x="1067" y="190" text-anchor="middle" font-family="'Cascadia Code','Consolas','SFMono-Regular',Menlo,monospace" font-size="15" fill="#d4af6a" letter-spacing="3">03 ▸ PRINT</text>
  <text x="1067" y="218" text-anchor="middle" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#e8ebf1">Any A4 printer. Saved to your</text>
  <text x="1067" y="240" text-anchor="middle" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#e8ebf1">register and analytics.</text>
</svg>
