# Every push and pull request: run the tests.
# A tag like v2.1.0: also build the setup wizard + portable ZIP and attach them to a draft GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: dotnet test

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/')
        run: choco install innosetup --no-progress -y

      - name: Build setup and portable ZIP (runs the tests first)
        if: startsWith(github.ref, 'refs/tags/')
        shell: cmd
        run: publish.bat

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            Share/RAKSpecial-Setup-*.exe
            Share/RAKSpecial-Portable-*.zip
