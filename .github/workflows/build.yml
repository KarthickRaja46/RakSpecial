# Every push and pull request: run the tests.
# A tag like v2.1.0: also build the setup wizard + portable ZIP and attach them to a draft GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: dotnet test

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/')
        run: choco install innosetup --no-progress -y

      - name: Build setup and portable ZIP (runs the tests first)
        if: startsWith(github.ref, 'refs/tags/')
        shell: cmd
        run: publish.bat

      # Same files under fixed names, so this link always gives the newest version:
      # https://github.com/KarthickRaja46/RakSpecial/releases/latest/download/RAKSpecial-Setup.exe
      - name: Fixed-name copies for direct download links
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Copy-Item (Get-Item Share/RAKSpecial-Setup-*.exe).FullName Share/RAKSpecial-Setup.exe
          Copy-Item (Get-Item Share/RAKSpecial-Portable-*.zip).FullName Share/RAKSpecial-Portable.zip

      # The "## <version>" section of CHANGELOG.md becomes the release notes
      # (shown on GitHub and in the app's "Update available" window).
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}'.TrimStart('v')
          $text = (Get-Content CHANGELOG.md -Raw) -replace "`r", ''
          $m = [regex]::Match($text, "(?ms)^## \[?$([regex]::Escape($ver))\]?[^\n]*\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success -and $m.Groups[1].Value.Trim()) { $m.Groups[1].Value.Trim() } else { 'Improvements and fixes.' }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          Write-Host $notes

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            Share/RAKSpecial-Setup.exe
            Share/RAKSpecial-Portable.zip
            Share/RAKSpecial-Setup-*.exe
            Share/RAKSpecial-Portable-*.zip
